# cargo-audit configuration, read from the repository root by CI and
# audit.yml (docs/setup.md "Dependency Checks"). Keep `ignore` the same as
# deny.toml's `[advisories] ignore`, which holds each exception's reason.

[advisories]
ignore = [
    # `lru` 0.16 `LruCache::pop` panic safety: glyphon never calls `pop` and
    # its `Copy` keys have no `Drop`. Remove when a glyphon release accepts
    # lru >= 0.18.2.
    "RUSTSEC-2026-0253",
    # `ttf-parser` unmaintained (no advisory against its code), parsing only
    # the Windows font file under fontdb. Remove when a cosmic-text release
    # under glyphon drops ttf-parser 0.25.
    "RUSTSEC-2026-0192",
    # `bare-metal` 0.2 deprecated (no advisory against its code), through
    # cortex-m 0.7 in the test device firmware. Remove when the firmware's
    # cortex-m drops bare-metal.
    "RUSTSEC-2026-0110",
    # `paste` unmaintained (no advisory against its code), a build-time proc
    # macro under embassy-rp's pio 0.3 in the test device firmware. Remove
    # when the firmware's pio crates drop paste.
    "RUSTSEC-2024-0436",
    # `proc-macro-error2` unmaintained (no advisory against its code), build
    # time under pio-proc (embassy-rp's pio 0.3) in the test device firmware.
    # Remove when the firmware's pio-proc drops proc-macro-error2.
    "RUSTSEC-2026-0173",
]
