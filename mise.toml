min_version = "2026.10.3"

[settings]
lockfile_platforms = ["windows-x64", "linux-x64", "macos-arm64"]
minimum_release_age = "1d"

[tool_config]
locked = true

[tools]
rust = { version = "1", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
lefthook = "2"
cargo-deny = "0"
"aqua:rustsec/rustsec/cargo-audit" = "0"
"github:bnjbvr/cargo-machete" = "0"
"github:nextest-rs/nextest" = { version = "0.9", version_prefix = "cargo-nextest-" }
actionlint = "1"
shellcheck = "0"
"github:babarot/gh-infra" = "0"
