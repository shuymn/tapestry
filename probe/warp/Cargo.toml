# Throwaway environment probe for issue #2: creates a D3D12 WARP device,
# clears an offscreen target, reads it back, and checks the pixels.
# Not a member of the main workspace.
[package]
name = "warp-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }
