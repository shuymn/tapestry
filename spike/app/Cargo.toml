[package]
name = "tapestry-spike"
version = "0.0.0"
description = "Stage 0 spike executable: rendering, audio and measurement on Windows."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# BGA decode and the FFmpeg license report. Dynamically linked against the
# LGPL shared build from scripts/fetch-tools.sh (FFMPEG_DIR in
# .cargo/config.toml); building it needs libclang (bindgen). Without it the
# rest of the app still builds (`--no-default-features`).
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
csv.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"], optional = true }
pollster = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
spike-core = { path = "../core" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
wgpu-hal = { version = "30", features = ["dx12"] }
winit = "0.30"
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
rtrb = "0.4.0"
triple_buffer = "9.0.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
