summary = "Selection's cue sounds for the cursor, places, panels and options"
class = "rule"
reason = """
A player hears selection answer each input: `scratch` for each row a \
one-row step moves the cursor, `f-open` for a place entered, `f-close` for \
a place left for its parent, `o-open` and `o-close` as an option panel \
shows and goes, and `o-change` for an order step, a preset step or a cover \
switch turned."""
