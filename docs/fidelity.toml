    "src/bms/player/beatoraja/select/MusicSelectInputProcessor.java:241-249 @beatoraja-0.8.9",
    "src/bms/player/beatoraja/select/MusicSelectInputProcessor.java:308-311 @beatoraja-0.8.9",
    "src/bms/player/beatoraja/select/BarManager.java:496-500 @beatoraja-0.8.9",
    "src/bms/player/beatoraja/skin/property/EventFactory.java:201 @beatoraja-0.8.9",
