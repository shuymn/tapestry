# Source behaviour tapestry keeps on purpose (design.md "Design Principles",
# "Reproduce a source's rules, not its byproducts"). Behaviour it does not
# copy is a "Differences from the source" entry instead; when a change stops
# a copy, its entry goes and a difference is recorded.
#
# Each entry: `id` (SF- and three digits, never reused), `summary`, `class`
# (`rule`, `compatibility` or `kept-byproduct`), `decision` (`#N`, the
# owner's decision; required for `kept-byproduct`), `reason` (why the copy
# stays: the rule a player can see or the compatibility it keeps), `source`
# (`<path>:<line>[-<line>] @<pin>`), `sites` (files that copy it) and `tests`
# (`<file>::<fn>`, tests that pin it). Each site and test carries a
# `// Source: SF-ddd` line; `cargo xtask check-fidelity` checks both sides.
#
# Pins, as `source` names them:
# - `@beatoraja-0.8.9`: beatoraja at tag `0.8.9`;
# - `@jbms-parser-e19bcc2`: jbms-parser at commit `e19bcc2`, which the
#   bundled jar was built from;
# - `@libgdx-1.9.9`: libGDX at tag `gdx-parent-1.9.9`;
# - `@luaj-jse-3.0.2-custom`: the LuaJ jar bundled with beatoraja 0.8.9,
#   `lib/luaj-jse-3.0.2-custom.jar`.
#
# docs/setup.md "Reference Sources" names the same pins.

[[entry]]
id = "SF-001"
summary = "A Lua skin's `op` that is not a table is no condition"
class = "compatibility"
decision = "#534"
reason = """
A Lua skin's converted table may hold a number, string, boolean or function \
as a destination's `op`, which the source reads as no condition; a surveyed \
play skin was refused without this (#382). Any other `op` that is not an \
array, and every JSON one, still fails the skin."""
source = ["src/bms/player/beatoraja/skin/lua/LuaSkinLoader.java:171-186 @beatoraja-0.8.9"]
sites = ["crates/skin-beatoraja/src/import/mod.rs"]
tests = ["crates/skin-beatoraja/tests/lua_op.rs::a_lua_op_that_is_not_a_table_is_no_condition"]

[[entry]]
id = "SF-002"
summary = "JSON wrapper names match ignoring ASCII case, and the first match wins"
class = "compatibility"
decision = "#534"
reason = """
Part of the libGDX JSON dialect the reader already follows: skins that load \
today may spell a wrapper name in any case, and dropping the match could only \
break them."""
source = ["gdx/src/com/badlogic/gdx/utils/JsonValue.java:95-99 @libgdx-1.9.9"]
sites = ["crates/skin-beatoraja/src/tree.rs"]
tests = ["crates/skin-beatoraja/tests/resolve.rs::wrapper_names_ignore_ascii_case_and_the_first_wins"]

[[entry]]
id = "SF-003"
summary = "JSON reader edges: `[1\\n,]` refused, `]` may start an unquoted name, `true`, `false` and `null` typed after unescaping"
class = "compatibility"
decision = "#534"
reason = """
Skins are written against the pinned reader's grammar, which the reader takes \
as the format's description: with these edges a skin file reads here as it \
reads there, and no file that loads changes its meaning."""
source = [
    "gdx/src/com/badlogic/gdx/utils/JsonReader.rl:108-109 @libgdx-1.9.9",
    "gdx/src/com/badlogic/gdx/utils/JsonReader.rl:118-128 @libgdx-1.9.9",
    "gdx/src/com/badlogic/gdx/utils/JsonReader.rl:216-268 @libgdx-1.9.9",
    "gdx/src/com/badlogic/gdx/utils/JsonReader.rl:291-301 @libgdx-1.9.9",
]
sites = [
    "crates/skin-beatoraja/src/json.rs",
    "crates/skin-beatoraja/src/tree.rs",
]
tests = [
    "crates/skin-beatoraja/src/json/tests.rs::one_comma_may_open_or_close_a_container",
    "crates/skin-beatoraja/src/json/tests.rs::unquoted_names_end_at_a_colon_line_break_or_comment",
    "crates/skin-beatoraja/src/json/tests.rs::tokens_are_typed_as_the_pinned_reader_types_them",
]

[[entry]]
id = "SF-004"
summary = "A song list's level strip ignores `padding`, `zeropadding` and digit offsets"
class = "compatibility"
decision = "#534"
reason = """
The selection loader builds every level strip this way, so skins draw their \
song-list levels for a blank-padded ten-glyph or eleven-glyph strip without \
offsets, whatever the record's other fields say."""
source = ["src/bms/player/beatoraja/skin/json/JsonSelectSkinObjectLoader.java:181-196 @beatoraja-0.8.9"]
sites = ["crates/skin-beatoraja/src/import/widget/number.rs"]
tests = ["crates/skin-beatoraja/tests/selection_frame.rs::level_strips_follow_the_selection_loader"]

[[entry]]
id = "SF-005"
summary = "A song-list bar's image set shares the first timer and the first cycle of its images that load"
class = "rule"
decision = "#534"
reason = """
A song-list rule a player sees: the images of one bar set animate together, \
on one timer and one cycle."""
source = ["src/bms/player/beatoraja/skin/json/JsonSelectSkinObjectLoader.java:50-63 @beatoraja-0.8.9"]
sites = ["crates/skin-beatoraja/src/import/selection/mod.rs"]
tests = ["crates/skin-beatoraja/tests/selection_import.rs::placements_take_their_set_s_timing"]

[[entry]]
id = "SF-006"
summary = "Blend 3 draws additive, as blend 2"
class = "compatibility"
decision = "#534"
reason = """
Skins are authored against what the source draws for blend 3: it sets the \
subtract equation and resets it to add before the element's quads draw, so \
they draw additive. The quads queued before them, which its batch flushes \
under subtract when that changes its blend factors, are its graphics \
library's batch state and keep their own blend here."""
source = ["src/bms/player/beatoraja/skin/Skin.java:657-662 @beatoraja-0.8.9"]
sites = ["crates/skin-beatoraja/src/import/mod.rs"]
tests = ["crates/skin-beatoraja/tests/import_multiply.rs::blend_three_draws_additive"]

[[entry]]
id = "SF-007"
summary = "`#RANDOM` and `#IF` are two flat stacks: `#ENDIF` pops the top flag, and an `#IF` with no open `#RANDOM` pushes none"
class = "rule"
decision = "#534"
reason = """
The rule charts are written and tested against (#67): each `#IF` is read by \
the latest `#RANDOM` value, a line by the top flag alone, so nested and \
unclosed blocks read as the reference decoder reads them, and an `#ENDIF` \
after an `#IF` with no value to test closes the enclosing block."""
source = ["src/bms/model/BMSDecoder.java:194-230 @jbms-parser-e19bcc2"]
sites = ["crates/bms-parser/src/branch.rs"]
tests = [
    "crates/bms-parser/tests/random.rs::nested_blocks_read_by_the_top_flag_only",
    "crates/bms-parser/tests/random.rs::stray_directives_warn_and_bad_values_fail",
    "crates/bms-parser/tests/random.rs::if_flags_stack_as_charts_expect",
]

[[entry]]
id = "SF-008"
summary = "A chart profile counts its notes over `floor(length / 1 s) + 2` seconds"
class = "rule"
decision = "#534"
reason = """
The song information's distribution length, which a player sees twice: the \
densities a song list shows divide by it, and the notes graph spans it, so \
the last notes sit short of the graph's right edge. A chart shows the \
densities and the graph its players know."""
source = [
    "src/bms/player/beatoraja/song/SongInformation.java:94-103 @beatoraja-0.8.9",
    "src/bms/player/beatoraja/skin/SkinNoteDistributionGraph.java:171-172 @beatoraja-0.8.9",
]
sites = ["crates/bms-model/src/profile.rs"]
tests = ["crates/bms-model/src/profile.rs::a_shown_object_lengthens_the_preview"]

[[entry]]
id = "SF-009"
summary = "The decision sound at the decision screen's start, never stopped by it"
class = "rule"
reason = """
A player hears the choice confirmed: the BGM set's `decide` (the tone when \
the set has none) starts once as the decision screen begins, whichever \
presentation draws, and the screen's end stops nothing, so the sound plays \
on into loading."""
source = ["src/bms/player/beatoraja/decide/MusicDecide.java:32-35 @beatoraja-0.8.9"]
sites = ["crates/player/src/selection.rs"]
tests = [
    "crates/player/src/selection.rs::the_decision_screen_is_out_before_its_fence",
    "crates/player/src/system_sounds/rig_tests.rs::decide_plays_on_into_loading",
]
