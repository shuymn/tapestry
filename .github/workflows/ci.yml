name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches more than documentation (docs/ and Markdown
  # files). The build jobs skip a documentation-only change; a skipped job
  # passes as a required check, and `lint` still checks its banned words.
  # Anything unclear (a manual run, an unknown range, a failure here) runs
  # them.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The pull request's merge commit, whose first parent is the base it is
      # tested against, or the history up to the pushed commit; trees only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: blob:none
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          # Exit 0 means no change outside the documentation; 1 (a change)
          # and 128 (an unreadable range) run the build jobs. Without rename
          # detection a file moved into docs/ also shows its old path.
          code=true
          if [ -n "$base" ] && git diff --quiet --no-renames "$base" HEAD -- . ':(exclude)docs/' ':(exclude)*.md'; then
            code=false
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: true
          cache: true
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
      - name: Show runner image
        run: echo "runner image $ImageOS $ImageVersion"
      - name: Format
        run: mise exec -- cargo fmt --all --check
      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (dev-tools)
        run: mise exec -- cargo clippy -p player -p game --all-targets --locked --features player/dev-tools,game/dev-tools -- -D warnings
      - name: Test
        run: mise exec -- cargo test --workspace --locked
      # Also run on Windows: build-dependencies resolve for the host, so the
      # R3 production-feature check sees cfg(windows) build-dependencies only here.
      - name: Architecture rules
        run: mise exec -- cargo xtask check-arch
      # Runs each benchmark once so it keeps building and running
      # (docs/setup.md "Benchmarks"); bench.yml measures.
      - name: Benchmarks run once
        run: mise exec -- cargo bench --locked -p render --bench skin -- --test
      - name: Production build
        run: mise exec -- cargo build --release --locked -p player --no-default-features
      # The allocation contracts also hold with optimizations (design.md
      # "Scope of No Allocation"); after the production build, whose release
      # dependencies it reuses.
      - name: Render staging allocation test (release)
        run: mise exec -- cargo test --release --locked -p render --test alloc
      - name: Production excludes dev-tools
        run: |
          mise exec -- cargo xtask check-binary --absent "tapestry dev-tools enabled" target/release/tapestry.exe
          # Each development argument, alone and in the `play` form a
          # development build takes, and the `measure` command (the
          # dev-tools tests are the positive control).
          for args in "--dev-tools-probe x" "--dev-scripted-input x" \
              "play x.bms --dev-scripted-input x" "play x.bms --dev-frames x" \
              "play x.bms --dev-auto-retry" "play x.bms --dev-overlay" \
              "play x.bms --auto --dev-headless" "play x.bms --dev-perfect" \
              "--dev-adjust-at 1" \
              "play x.bms --dev-adjust-at 1" "play x.bms --dev-adjust F1" \
              "play x.bms --dev-adjust-end F1" "keys --dev-scripted-keys 1" \
              "measure play x.bms" "--dev-scenario x"; do
            arg=$(echo "$args" | grep -o -e "--dev-[a-z-]*" -e "^measure")
            set +e
            # shellcheck disable=SC2086 # split into arguments on purpose
            target/release/tapestry.exe $args 2> probe.err
            code=$?
            set -e
            cat probe.err
            test "$code" -eq 2
            grep -q "unknown argument: $arg" probe.err
          done
      - name: Development build includes dev-tools (positive control)
        run: |
          mise exec -- cargo build --locked -p player --features dev-tools
          mise exec -- cargo xtask check-binary --present "tapestry dev-tools enabled" target/debug/tapestry.exe
          target/debug/tapestry.exe --dev-tools-probe
      # The game on its threads, driven by a scripted input log, on WARP.
      - name: Test (dev-tools)
        run: mise exec -- cargo test -p player -p game --features player/dev-tools,game/dev-tools --locked

  linux:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: true
          cache: true
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
      - name: Format
        run: mise exec -- cargo fmt --all --check
      - name: Architecture rules
        run: mise exec -- cargo xtask check-arch
      - name: Clippy (portable crates)
        run: mise exec -- cargo xtask portable clippy --all-targets --locked -- -D warnings
      - name: Lint fixtures
        run: mise exec -- cargo xtask check-lints
      - name: Test (portable crates)
        run: mise exec -- cargo xtask portable test --locked
      # Runs each benchmark once so it keeps building and running
      # (docs/setup.md "Benchmarks"); bench.yml measures.
      - name: Benchmarks run once
        run: mise exec -- cargo bench --locked -p eval -p bms-parser -p library -p skin-model -p audio --bench evaluate --bench load --bench scan --bench build --bench loudness -- --test
      # The allocation contracts also hold with optimizations (design.md
      # "Scope of No Allocation").
      - name: Allocation tests (release)
        run: mise exec -- cargo test --release --locked -p eval -p input -p game -p audio -p skin-model --test alloc --test audio_alloc --test audio_burst --test ring_out_alloc --test autoplay_iter_alloc --test loudness_alloc
      # The fuzz crate is its own workspace (fuzz/Cargo.toml), which the
      # workspace commands above do not reach.
      - name: Format (fuzz crate)
        run: mise exec -- cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Clippy (fuzz crate)
        run: mise exec -- cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test (fuzz seed smoke cases)
        run: mise exec -- cargo test --manifest-path fuzz/Cargo.toml --locked
      # An unreadable registry index only warns and skips the yanked check.
      - name: cargo-deny
        run: |
          mise exec -- cargo deny check --deny index-failure
          mise exec -- cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check --deny index-failure
      # `--with-metadata` also covers dev-, build- and target-specific
      # dependencies. cargo-machete exits 0 when it cannot read a manifest or
      # run cargo metadata, so its error lines fail the step; it runs cargo
      # metadata without `--locked`, so both lockfiles must stay unchanged.
      - name: cargo-machete
        run: |
          set -o pipefail
          mise exec -- cargo machete --with-metadata 2>&1 | tee "$RUNNER_TEMP/machete.log"
          if grep '^error when handling' "$RUNNER_TEMP/machete.log"; then exit 1; fi
          git diff --exit-code Cargo.lock fuzz/Cargo.lock
      # cargo-audit only logs index failures (on stderr, which the guard scans).
      - name: cargo-audit
        run: |
          set -o pipefail
          for lock in Cargo.lock fuzz/Cargo.lock; do
            { mise exec -- cargo audit --file "$lock" --deny warnings 2>&1 1>&3 | tee "$RUNNER_TEMP/audit.log" >&2; } 3>&1
            if grep -E "couldn't (update|open) crates.io index|couldn't check if the package is yanked" "$RUNNER_TEMP/audit.log"; then exit 1; fi
          done

  # The crates the IR server runs as WASM keep building for it (design.md
  # "Server Architecture (Cloudflare)"). The target comes from mise.toml;
  # zstd-sys compiles its C sources with the runner image's clang.
  wasm:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: true
          cache: true
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
          mise exec -- rustup target list --installed | grep -x wasm32-unknown-unknown
          clang --version
          echo "runner image $ImageOS $ImageVersion"
      - name: Build (wasm32-unknown-unknown, release)
        run: mise exec -- cargo build --release --locked --target wasm32-unknown-unknown -p eval -p bms-parser -p replay

  # The Nix dev shells used from WSL: the flake evaluates with the Rust version
  # from mise.lock, the wrapper's Linux path passes arguments and exit codes,
  # and short fuzz runs pass in the `fuzz` shell (docs/setup.md "Fuzzing").
  nix:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Test (portable crates, dev shell)
        run: scripts/wsl.sh cargo xtask portable test --locked
      - name: Wrapper self-test
        run: scripts/wsl-selftest.sh
      - name: Build fuzz targets
        run: TAPESTRY_NIX_SHELL=fuzz scripts/wsl.sh scripts/fuzz.sh build
      # A panic, a hang and each memory limit fail a run, seen from outside
      # the wrapper.
      - name: Fuzz self-test
        run: scripts/fuzz-selftest.sh
      # A fixed libFuzzer seed keeps the run reproducible.
      - name: Fuzz (60 s per target, generated seeds)
        run: TAPESTRY_NIX_SHELL=fuzz scripts/wsl.sh scripts/fuzz.sh run-all 60 --seed 1

  # Runs on every change, documentation included.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Only the tools in install_args are needed; keep `mise exec` from
      # installing the rest on demand.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: true
          install_args: rust actionlint shellcheck
          cache: true
      - name: Banned words
        run: mise exec -- cargo xtask banned-words --all
      - name: actionlint
        run: mise exec -- actionlint
      - name: shellcheck
        run: mise exec -- shellcheck scripts/*.sh
      # Refused before anything is built, so no Rust is needed here.
      - name: Fuzz durations out of range are refused
        run: |
          for seconds in -1 0 0.5 1801; do
            for args in "run replay_body $seconds" "run-all $seconds"; do
              set +e
              # shellcheck disable=SC2086 # split into arguments on purpose
              scripts/fuzz.sh $args 2> fuzz.err
              code=$?
              set -e
              cat fuzz.err
              test "$code" -eq 2
              grep -q "seconds must be a whole number from 1 to 1800: got '$seconds'" fuzz.err
            done
          done
