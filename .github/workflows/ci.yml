name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches a file the build jobs read: anything but the
  # documentation (docs/ and Markdown files) and repository files no build
  # job reads (the license texts, the hook, repository settings,
  # Renovate's settings and the other workflows, which run on their own).
  # The build jobs skip a change of only those; a skipped job passes as a
  # required check, and `lint` still checks its banned words and workflows.
  # Anything unclear (a manual run, an unknown range, a failure here) runs
  # them.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The pull request's merge commit, whose first parent is the base it is
      # tested against, or the history up to the pushed commit; trees only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: blob:none
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          # Exit 0 means no change outside those files; 1 (a change) and
          # 128 (an unreadable range) run the build jobs. Without rename
          # detection a file moved into docs/ also shows its old path.
          code=true
          if [ -n "$base" ] && git diff --quiet --no-renames "$base" HEAD -- . \
              ':(exclude)docs/' ':(exclude)*.md' \
              ':(exclude,top)COPYRIGHT' ':(exclude,top,glob)LICENSE-*' \
              ':(exclude,top)lefthook.yml' \
              ':(exclude,top).github/infra.yaml' ':(exclude,top).github/renovate.json' \
              ':(exclude,top).github/workflows/audit.yml' ':(exclude,top).github/workflows/bench.yml' \
              ':(exclude,top).github/workflows/fuzz.yml' ':(exclude,top).github/workflows/mise-update.yml'; then
            code=false
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The Windows checks run as five jobs in parallel, each building on its
  # own runner: `windows-test` the workspace's lints and tests,
  # `windows-release` the optimized builds and the production binary, and
  # `windows-dev-tools-1` to `-3` the development features and the game on
  # its threads, in three parts. `windows` is the required check over all.
  windows-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    # Line tables keep backtraces' file and line and make the debug
    # artifacts, and so the cache, much smaller than full debug info.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
      - name: Show runner image
        run: echo "runner image $ImageOS $ImageVersion"
      # Dependencies built with optimizations: the CPU-bound tests ran 15-20 %
      # faster here (not on Linux), and rust-cache keeps them. Before
      # rust-cache, which hashes .cargo/config.toml into its key.
      - name: Optimize dependencies in debug builds
        run: printf '\n[profile.dev.package."*"]\nopt-level = 2\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: mise exec -- {0}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: mise exec -- cargo fmt --all --check
      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: mise exec -- cargo nextest run --workspace --locked --no-fail-fast
      # Also run on Windows: build-dependencies resolve for the host, so the
      # R3 production-feature check sees cfg(windows) build-dependencies only here.
      - name: Architecture rules
        run: mise exec -- cargo xtask check-arch

  windows-release:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
      - name: Show runner image
        run: echo "runner image $ImageOS $ImageVersion"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: mise exec -- {0}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Runs each benchmark once so it keeps building and running
      # (docs/setup.md "Benchmarks"); bench.yml measures.
      - name: Benchmarks run once
        run: mise exec -- cargo bench --locked -p render --bench skin -- --test
      - name: Production build
        run: mise exec -- cargo build --release --locked -p player --no-default-features
      # The allocation contracts also hold with optimizations (design.md
      # "Scope of No Allocation"); after the production build, whose release
      # dependencies it reuses.
      - name: Render staging allocation test (release)
        run: mise exec -- cargo test --release --locked -p render --test alloc --test decision_build_alloc
      # The loader's chart ceiling (design.md "Memory Budget"): one ignored
      # measurement, run alone in the release profile it is sized for.
      - name: Chart memory ceiling (release)
        run: mise exec -- cargo test --release --locked -p bms-parser --test memory -- --ignored --exact measure_load_peaks
      - name: Production excludes dev-tools
        run: |
          mise exec -- cargo xtask check-binary --absent "tapestry dev-tools enabled" target/release/tapestry.exe
          # Each development argument, alone and in the `play` form a
          # development build takes, and the `measure` command (the
          # dev-tools tests are the positive control).
          for args in "--dev-tools-probe x" "--dev-scripted-input x" \
              "play x.bms --dev-scripted-input x" "play x.bms --dev-frames x" \
              "play x.bms --dev-auto-retry" "play x.bms --dev-overlay" \
              "play x.bms --auto --dev-headless" "play x.bms --dev-perfect" \
              "--dev-adjust-at 1" \
              "play x.bms --dev-adjust-at 1" "play x.bms --dev-adjust F1" \
              "play x.bms --dev-adjust-end F1" "play x.bms --dev-size 8x8" \
              "keys --dev-scripted-keys 1" \
              "measure play x.bms" "--dev-scenario x"; do
            arg=$(echo "$args" | grep -o -e "--dev-[a-z-]*" -e "^measure")
            set +e
            # shellcheck disable=SC2086 # split into arguments on purpose
            target/release/tapestry.exe $args 2> probe.err
            code=$?
            set -e
            cat probe.err
            test "$code" -eq 2
            grep -q "unknown argument: $arg" probe.err
          done
      # The player's allocation guards are unit tests of its binary, whose
      # counting allocator exists only with dev-tools; `_alloc` selects them
      # (`cargo xtask check-alloc-tests`). After the production checks above,
      # as the one step here that builds with dev-tools.
      - name: Player allocation guards (release)
        run: mise exec -- cargo test --release --locked -p player --features dev-tools --bin tapestry -- _alloc

  # The dev-tools tests, bound by a runner's cores, run as three jobs, each
  # on its own runner with one nextest partition (`slice`, round-robin over
  # the sorted test list); `PART` and `PARTS` select it. Separate jobs, not
  # a matrix, so `windows` sees each one's result: a matrix leg cancelled
  # before it gets a runner can leave the matrix's result `success`. The
  # jobs share their steps through the `dev-tools-steps` anchor; the first
  # alone also runs clippy, the positive control and the check that the
  # partitions cover every test exactly once, and saves the cache they
  # share. Adding a part means a job here, `PARTS` in each and a `needs`
  # entry and result in `windows`.
  windows-dev-tools-1:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    # Line tables keep backtraces' file and line and make the debug
    # artifacts, and so the cache, much smaller than full debug info.
    # DEV_TOOLS names the packages and features every part tests.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      DEV_TOOLS: -p player -p game -p input -p skin-beatoraja -p skin-model --features player/dev-tools,game/dev-tools,input/dev-tools,skin-beatoraja/dev-tools,skin-model/dev-tools --locked
      PART: 1
      PARTS: 3
    defaults:
      run:
        shell: bash
    steps: &dev-tools-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
      - name: Show runner image
        run: echo "runner image $ImageOS $ImageVersion"
      # Dependencies built with optimizations: the CPU-bound tests ran 15-20 %
      # faster here (not on Linux), and rust-cache keeps them. Before
      # rust-cache, which hashes .cargo/config.toml into its key.
      - name: Optimize dependencies in debug builds
        run: printf '\n[profile.dev.package."*"]\nopt-level = 2\n' >> .cargo/config.toml
      # One cache for the parts, under the key the single job used; the
      # first part builds everything the others build (and clippy's), so
      # only it saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: mise exec -- {0}
          cache-bin: false
          shared-key: windows-dev-tools
          save-if: ${{ github.ref == 'refs/heads/main' && env.PART == '1' }}
      - name: Clippy (dev-tools)
        if: ${{ env.PART == '1' }}
        run: |
          # shellcheck disable=SC2086 # DEV_TOOLS is split into arguments on purpose
          mise exec -- cargo clippy $DEV_TOOLS --all-targets -- -D warnings
      - name: Development build includes dev-tools (positive control)
        if: ${{ env.PART == '1' }}
        run: |
          mise exec -- cargo build --locked -p player --features dev-tools
          mise exec -- cargo xtask check-binary --present "tapestry dev-tools enabled" target/debug/tapestry.exe
          target/debug/tapestry.exe --dev-tools-probe
      # The partitions together list each test of the unpartitioned run
      # exactly once, so no test leaves CI unnoticed.
      - name: Partitions cover every test (dev-tools)
        if: ${{ env.PART == '1' }}
        run: |
          all="$RUNNER_TEMP/all-tests.txt"
          parts="$RUNNER_TEMP/partition-tests.txt"
          # shellcheck disable=SC2086 # DEV_TOOLS is split into arguments on purpose
          mise exec -- cargo nextest list $DEV_TOOLS --message-format oneline | sort > "$all"
          for k in $(seq 1 "$PARTS"); do
            # shellcheck disable=SC2086
            mise exec -- cargo nextest list $DEV_TOOLS --partition "slice:$k/$PARTS" --message-format oneline
          done | sort > "$parts"
          echo "$(wc -l < "$all") tests; $(wc -l < "$parts") over $PARTS partitions"
          test -s "$all"
          diff "$all" "$parts"
      # The game on its threads, driven by a scripted input log, on WARP.
      - name: Test (dev-tools)
        run: |
          # shellcheck disable=SC2086 # DEV_TOOLS is split into arguments on purpose
          mise exec -- cargo nextest run $DEV_TOOLS --partition "slice:$PART/$PARTS" --no-fail-fast

  windows-dev-tools-2:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      DEV_TOOLS: -p player -p game -p input -p skin-beatoraja -p skin-model --features player/dev-tools,game/dev-tools,input/dev-tools,skin-beatoraja/dev-tools,skin-model/dev-tools --locked
      PART: 2
      PARTS: 3
    defaults:
      run:
        shell: bash
    steps: *dev-tools-steps

  windows-dev-tools-3:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      DEV_TOOLS: -p player -p game -p input -p skin-beatoraja -p skin-model --features player/dev-tools,game/dev-tools,input/dev-tools,skin-beatoraja/dev-tools,skin-model/dev-tools --locked
      PART: 3
      PARTS: 3
    defaults:
      run:
        shell: bash
    steps: *dev-tools-steps

  # Passes when every Windows job passed, or when `changes` found no change
  # the build jobs read and they were all skipped; anything else (a failed,
  # cancelled or unexpectedly skipped job, or a missing result) fails it.
  windows:
    needs: [changes, windows-test, windows-release, windows-dev-tools-1, windows-dev-tools-2, windows-dev-tools-3]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the Windows jobs
        env:
          CLASSIFIED: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.windows-test.result }} ${{ needs.windows-release.result }} ${{ needs.windows-dev-tools-1.result }} ${{ needs.windows-dev-tools-2.result }} ${{ needs.windows-dev-tools-3.result }}
        run: |
          echo "changes $CLASSIFIED (code=$CODE); windows-test, windows-release, windows-dev-tools-1..3: $RESULTS"
          allowed=success
          if [ "$CLASSIFIED" = success ] && [ "$CODE" = false ]; then allowed=skipped; fi
          # shellcheck disable=SC2086 # one word per job
          set -- $RESULTS
          test "$#" -eq 5
          for result in "$@"; do
            test "$result" = "$allowed"
          done

  linux:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # This job builds debug, release, bench and fuzz targets, which outgrow
      # the runner's free disk; remove preinstalled SDKs it never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
      # The fuzz crate is a workspace of its own, with its own lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: mise exec -- {0}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            fuzz -> target
      - name: Format
        run: mise exec -- cargo fmt --all --check
      - name: Architecture rules
        run: mise exec -- cargo xtask check-arch
      - name: Clippy (portable crates)
        run: mise exec -- cargo xtask portable clippy --all-targets --locked -- -D warnings
      - name: Lint fixtures
        run: mise exec -- cargo xtask check-lints
      - name: Test (portable crates)
        run: mise exec -- cargo xtask portable nextest run --locked --no-fail-fast
      # The Lua runtime's tests that run frames take a time budget no frame
      # reaches through dev-tools hooks, which the portable run leaves out;
      # so does the replay harness, a dev-tools binary (design.md "beatoraja
      # Lua Skins", the reference executor).
      - name: Lua runtime and replay tests (dev-tools)
        run: mise exec -- cargo nextest run --locked --no-fail-fast -p skin-beatoraja --features dev-tools --test lua_runtime --bin lua_replay
      # Runs each benchmark once so it keeps building and running
      # (docs/setup.md "Benchmarks"); bench.yml measures.
      - name: Benchmarks run once
        run: mise exec -- cargo bench --locked -p eval -p bms-parser -p library -p skin-model -p audio --bench evaluate --bench load --bench scan --bench build --bench loudness -- --test
      - name: Lua skin benchmark runs once
        run: mise exec -- cargo bench --locked -p skin-beatoraja --features dev-tools --bench lua -- --test
      # The allocation contracts also hold with optimizations (design.md
      # "Scope of No Allocation").
      - name: Allocation tests (release)
        run: mise exec -- cargo test --release --locked -p eval -p input -p game -p audio -p skin-model --test alloc --test audio_alloc --test audio_burst_alloc --test ring_out_alloc --test autoplay_iter_alloc --test loudness_alloc --test tempo_alloc --test adjustment_alloc --test rearm_alloc --test history_alloc --test restore_alloc --test reopen_alloc --test tail_alloc --test closing_alloc --test ending_alloc --test readouts_alloc --test driver_alloc --test selection_alloc --test result_alloc --test chart_images_alloc --test score_graphs_alloc
      # The element observations a capture reads run in every play frame of a
      # dev-tools build, so the skin's guard holds with them on too.
      - name: Skin allocation test with observations (release)
        run: mise exec -- cargo test --release --locked -p skin-model --features dev-tools --test alloc
      # The fuzz crate is its own workspace (fuzz/Cargo.toml), which the
      # workspace commands above do not reach.
      - name: Format (fuzz crate)
        run: mise exec -- cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Clippy (fuzz crate)
        run: mise exec -- cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test (fuzz seed smoke cases)
        run: mise exec -- cargo test --manifest-path fuzz/Cargo.toml --locked
      # An unreadable registry index only warns and skips the yanked check;
      # dep-check.sh fails on it after three tries (docs/setup.md
      # "Dependency Checks").
      - name: cargo-deny
        run: |
          scripts/dep-check.sh deny check --deny index-failure
          scripts/dep-check.sh deny --manifest-path fuzz/Cargo.toml --config deny.toml check --deny index-failure
      # `--with-metadata` also covers dev-, build- and target-specific
      # dependencies. cargo-machete exits 0 when it cannot read a manifest or
      # run cargo metadata, so its error lines fail the step; it runs cargo
      # metadata without `--locked`, so both lockfiles must stay unchanged.
      - name: cargo-machete
        run: |
          set -o pipefail
          mise exec -- cargo machete --with-metadata 2>&1 | tee "$RUNNER_TEMP/machete.log"
          if grep '^error when handling' "$RUNNER_TEMP/machete.log"; then exit 1; fi
          git diff --exit-code Cargo.lock fuzz/Cargo.lock
      # cargo-audit only logs index failures (on stderr, which dep-check.sh
      # scans).
      - name: cargo-audit
        run: |
          scripts/dep-check.sh audit --file Cargo.lock --deny warnings
          scripts/dep-check.sh audit --file fuzz/Cargo.lock --deny warnings
      - name: Disk usage
        if: ${{ !cancelled() }}
        run: |
          df -h /
          du -sh target fuzz/target 2>/dev/null || true

  # The crates the IR server runs as WASM keep building for it (design.md
  # "Server Architecture (Cloudflare)"). The target comes from mise.toml;
  # zstd-sys compiles its C sources with the runner image's clang.
  wasm:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Show toolchain
        run: |
          mise ls --current
          expected=$(mise current rust)
          actual=$(mise exec -- rustc --version | cut -d' ' -f2)
          test "$expected" = "$actual"
          mise exec -- rustc -Vv
          mise exec -- rustup target list --installed | grep -x wasm32-unknown-unknown
          clang --version
          echo "runner image $ImageOS $ImageVersion"
      - name: Build (wasm32-unknown-unknown, release)
        run: mise exec -- cargo build --release --locked --target wasm32-unknown-unknown -p eval -p bms-parser -p replay

  # The Nix dev shells used from WSL: the flake evaluates with the Rust version
  # from mise.lock, the wrapper's Linux path passes arguments and exit codes,
  # and short fuzz runs pass in the `fuzz` shell (docs/setup.md "Fuzzing").
  # `nix-test` and `nix-fuzz` run in parallel; `nix` is the required check
  # over the two.
  nix-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # The wrapper self-test enters the `fuzz` shell too.
      - name: Prepare the dev shells
        run: scripts/nix-prepare.sh default fuzz
      - name: Test (portable crates, dev shell)
        run: scripts/wsl.sh cargo xtask portable test --locked
      - name: Wrapper self-test
        run: scripts/wsl-selftest.sh

  nix-fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Prepare the dev shell
        run: scripts/nix-prepare.sh fuzz
      - name: Build fuzz targets
        run: TAPESTRY_NIX_SHELL=fuzz scripts/wsl.sh scripts/fuzz.sh build
      # A panic, a hang and each memory limit fail a run, seen from outside
      # the wrapper.
      - name: Fuzz self-test
        run: scripts/fuzz-selftest.sh
      # A fixed libFuzzer seed keeps the run reproducible. One target per
      # core at once: each libFuzzer run is single-threaded.
      - name: Fuzz (60 s per target, generated seeds)
        run: TAPESTRY_NIX_SHELL=fuzz scripts/wsl.sh scripts/fuzz.sh run-all 60 --seed 1 --jobs "$(nproc)"

  # Passes as `windows` does, over `nix-test` and `nix-fuzz`.
  nix:
    needs: [changes, nix-test, nix-fuzz]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the Nix jobs
        env:
          CLASSIFIED: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.nix-test.result }} ${{ needs.nix-fuzz.result }}
        run: |
          echo "changes $CLASSIFIED (code=$CODE); nix-test, nix-fuzz: $RESULTS"
          allowed=success
          if [ "$CLASSIFIED" = success ] && [ "$CODE" = false ]; then allowed=skipped; fi
          for result in $RESULTS; do
            test "$result" = "$allowed"
          done

  # Runs on every change, including those the build jobs skip.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Only the tools in install_args are needed; keep `mise exec` from
      # installing the rest on demand.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: rust actionlint shellcheck
      - name: Banned words
        run: mise exec -- cargo xtask banned-words --all
      # Each allocation guard also runs in a release step above.
      - name: Allocation tests in release steps
        run: mise exec -- cargo xtask check-alloc-tests
      # Docs-only changes too: a clause and its tests change together.
      - name: Contract index
        run: mise exec -- cargo xtask check-contract
      - name: actionlint
        run: mise exec -- actionlint
      - name: shellcheck
        run: mise exec -- shellcheck scripts/*.sh
      # Refused before anything is built, so no Rust is needed here.
      - name: Fuzz durations out of range are refused
        run: |
          for seconds in -1 0 0.5 1801; do
            for args in "run replay_body $seconds" "run-all $seconds"; do
              set +e
              # shellcheck disable=SC2086 # split into arguments on purpose
              scripts/fuzz.sh $args 2> fuzz.err
              code=$?
              set -e
              cat fuzz.err
              test "$code" -eq 2
              grep -q "seconds must be a whole number from 1 to 1800: got '$seconds'" fuzz.err
            done
          done
