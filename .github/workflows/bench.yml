name: Bench

# The CPU benchmarks on the merge base and on the head, each crate group in
# one job on one runner, with criterion's change estimates printed at the end
# (docs/setup.md "Benchmarks"). `compare` runs `eval`, `bms-parser`, `library`,
# `skin-model` and `audio` on Linux, `compare-render` runs `render` on
# Windows.
# Shared runners move a benchmark by more than criterion's confidence interval
# shows (about 2 % on Linux, 5 % for `render`, on unchanged code), so a
# regression counts only beyond a 3 % noise threshold and when
# scripts/bench-confirm.sh measures it again and it repeats.
# Neither is a required check and neither fails the run: a reviewer reads the
# confirmed regressions.

on:
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/bench.yml
      - scripts/bench-confirm.sh
  workflow_dispatch:

permissions: {}

env:
  # A regression must exceed this fraction in both measurements
  # (docs/setup.md "Benchmarks").
  NOISE_THRESHOLD: "0.03"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    # The two suites take up to about 19 minutes and the confirmation stops
    # at 15, which leaves the summary time.
    timeout-minutes: 40
    # A failed step is reported, but does not fail the run.
    continue-on-error: true
    permissions:
      contents: read
    env:
      # Only the tools in install_args are needed; keep `mise exec` from
      # installing the rest on demand.
      MISE_EXEC_AUTO_INSTALL: "false"
      # The head builds in its own `target` and the merge base into a
      # directory of its own: cargo gives a workspace crate's artifacts the
      # same name in both checkouts and judges them by modification time, so
      # in one shared directory the head run can reuse the merge base's
      # binaries. No CARGO_TARGET_DIR is set for the job, since rust-cache
      # hashes every CARGO variable into its key, which must match CI's.
      # Criterion's results share one directory, so the head run compares
      # against the baseline the merge base saved.
      CRITERION_HOME: ${{ github.workspace }}/target/criterion
    steps:
      # The head commit itself, not the merge commit a pull request would
      # check out by default, and the full history to find the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: rust
      # The dependencies in the bench profile, from CI `linux`'s cache on `main`
      # ("Benchmarks run once" builds the same ones); restored only. Each
      # build starts from them: the merge base's directory gets a copy, which
      # holds no workspace crate (rust-cache removes those before saving).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          cmd-format: mise exec -- {0}
          cache-bin: false
          save-if: false
          # CI's paths, in its order: the cache's version covers them.
          workspaces: |
            . -> target
            fuzz -> target
      # Both builds use the toolchain of the head: `mise exec` runs in the
      # head's checkout and cargo is pointed at the merge base's manifest.
      # `--bench` names keep the libtest unit-test harnesses, which do not
      # take criterion's options, out of the run.
      - name: Benchmark the merge base
        id: base
        run: |
          base=$(git merge-base origin/main HEAD)
          echo "merge base $base, head $(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [ -d target ]; then cp -a target "$RUNNER_TEMP/base-target"; fi
          if [ ! -f "$RUNNER_TEMP/base/crates/eval/benches/evaluate.rs" ]; then
            echo "::notice::The merge base has no benchmarks; there is nothing to compare."
            exit 0
          fi
          benches=(-p eval -p bms-parser --bench evaluate --bench load)
          # A merge base from before the library benchmark runs without it.
          if [ -f "$RUNNER_TEMP/base/crates/library/benches/scan.rs" ]; then
            benches+=(-p library --bench scan)
          fi
          # A merge base from before the skin-model benchmark runs without it.
          if [ -f "$RUNNER_TEMP/base/crates/skin-model/benches/build.rs" ]; then
            benches+=(-p skin-model --bench build)
          fi
          # A merge base from before the loudness benchmark runs without it.
          if [ -f "$RUNNER_TEMP/base/crates/audio/benches/loudness.rs" ]; then
            benches+=(-p audio --bench loudness)
          fi
          echo "benches=${benches[*]}" >> "$GITHUB_OUTPUT"
          if CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" mise exec -- cargo bench --manifest-path "$RUNNER_TEMP/base/Cargo.toml" "${benches[@]}" -- --save-baseline base; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The benchmarks of the merge base failed."
          fi
      # `--baseline-lenient` lets a benchmark the merge base lacks run
      # without a comparison, and `--no-fail-fast` keeps one failing
      # executable from hiding the others; whatever was captured is printed
      # even after a failure.
      - name: Benchmark the head against it
        id: head
        if: steps.base.outputs.saved == 'true'
        run: |
          set -o pipefail
          status=0
          mise exec -- cargo bench --no-fail-fast -p eval -p bms-parser -p library -p skin-model -p audio --bench evaluate --bench load --bench scan --bench build --bench loudness -- --baseline-lenient base --noise-threshold "$NOISE_THRESHOLD" 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          echo "measured=true" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::The benchmarks of the head failed (exit $status); the results are partial."
          fi
      # Measures the flagged benchmarks once more, merge base and then head,
      # with the binaries both builds left.
      # Its own deadline (8 of the slowest benchmarks take about 6 minutes)
      # leaves the summary time within the job's; a confirmation that runs out
      # of it leaves its regressions unconfirmed.
      - name: Confirm the regressions
        if: steps.head.outputs.measured == 'true'
        timeout-minutes: 15
        continue-on-error: true
        env:
          BENCHES: ${{ steps.base.outputs.benches }}
        run: scripts/bench-confirm.sh "$RUNNER_TEMP/bench.log" "$NOISE_THRESHOLD" "$RUNNER_TEMP/base" "$RUNNER_TEMP/base-target" "$RUNNER_TEMP/confirmed.md"
      # A step of its own, run even after a failure or a cancellation, so a
      # confirmation that fails or runs out of time still leaves the first
      # comparison in the summary.
      - name: Summary
        if: ${{ always() && steps.head.outputs.measured == 'true' }}
        run: |
          {
            echo '### Benchmarks: head against merge base'
            cat "$RUNNER_TEMP/confirmed.md" 2>/dev/null || echo '**The confirmation did not finish; the regressions below are unconfirmed.**'
            echo
            echo "First measurement, every change (\"regressed\" there is beyond the noise threshold of $NOISE_THRESHOLD but unconfirmed):"
            echo '```'
            grep -v '^Benchmarking ' "$RUNNER_TEMP/bench.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compare-render:
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      CRITERION_HOME: ${{ github.workspace }}/target/criterion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: rust
      # The dependencies in the bench profile, from CI `windows-release`'s cache on `main`
      # ("Benchmarks run once" builds the same ones); restored only. Each
      # build starts from them: the merge base's directory gets a copy, which
      # holds no workspace crate (rust-cache removes those before saving).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          cmd-format: mise exec -- {0}
          cache-bin: false
          save-if: false
      - name: Benchmark the merge base
        id: base
        run: |
          base=$(git merge-base origin/main HEAD)
          echo "merge base $base, head $(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [ -d target ]; then cp -a target "$RUNNER_TEMP/base-target"; fi
          if [ ! -f "$RUNNER_TEMP/base/crates/render/benches/skin.rs" ]; then
            echo "::notice::The merge base has no render benchmark; there is nothing to compare."
            exit 0
          fi
          if CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" mise exec -- cargo bench --manifest-path "$RUNNER_TEMP/base/Cargo.toml" -p render --bench skin -- --save-baseline base; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The render benchmark of the merge base failed."
          fi
      - name: Benchmark the head against it
        id: head
        if: steps.base.outputs.saved == 'true'
        run: |
          set -o pipefail
          status=0
          mise exec -- cargo bench --no-fail-fast -p render --bench skin -- --baseline-lenient base --noise-threshold "$NOISE_THRESHOLD" 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          echo "measured=true" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::The render benchmark of the head failed (exit $status); the results are partial."
          fi
      - name: Confirm the regression
        if: steps.head.outputs.measured == 'true'
        timeout-minutes: 10
        continue-on-error: true
        env:
          BENCHES: -p render --bench skin
        run: scripts/bench-confirm.sh "$RUNNER_TEMP/bench.log" "$NOISE_THRESHOLD" "$RUNNER_TEMP/base" "$RUNNER_TEMP/base-target" "$RUNNER_TEMP/confirmed.md"
      - name: Summary
        if: ${{ always() && steps.head.outputs.measured == 'true' }}
        run: |
          {
            echo '### Render benchmark: head against merge base'
            cat "$RUNNER_TEMP/confirmed.md" 2>/dev/null || echo '**The confirmation did not finish; a regression below is unconfirmed.**'
            echo
            echo "First measurement (\"regressed\" there is beyond the noise threshold of $NOISE_THRESHOLD but unconfirmed):"
            echo '```'
            grep -v '^Benchmarking ' "$RUNNER_TEMP/bench.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
