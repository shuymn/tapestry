name: Bench

# The CPU benchmarks on the merge base and on the head, each crate group in
# one job on one runner, with criterion's change estimates printed at the end
# (docs/setup.md "Benchmarks"). `compare` runs `eval` and `bms-parser` on
# Linux, `compare-render` runs `render` on Windows. Neither is a required
# check and neither fails the run: shared runners are noisy, so a reviewer
# reads the numbers.

on:
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A failed step is reported, but does not fail the run.
    continue-on-error: true
    permissions:
      contents: read
    env:
      # Only the tools in install_args are needed; keep `mise exec` from
      # installing the rest on demand.
      MISE_EXEC_AUTO_INSTALL: "false"
      # One target directory, so criterion's saved baseline of the merge
      # base is the one the head run compares against.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      # The head commit itself, not the merge commit a pull request would
      # check out by default, and the full history to find the merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.3
          install: true
          install_args: rust
          cache: true
      # Both builds use the toolchain of the head: `mise exec` runs in the
      # head's checkout and cargo is pointed at the merge base's manifest.
      # `--bench` names keep the libtest unit-test harnesses, which do not
      # take criterion's options, out of the run.
      - name: Benchmark the merge base
        id: base
        run: |
          base=$(git merge-base origin/main HEAD)
          echo "merge base $base, head $(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [ ! -f "$RUNNER_TEMP/base/crates/eval/benches/evaluate.rs" ]; then
            echo "::notice::The merge base has no benchmarks; there is nothing to compare."
            exit 0
          fi
          if mise exec -- cargo bench --manifest-path "$RUNNER_TEMP/base/Cargo.toml" -p eval -p bms-parser --bench evaluate --bench load -- --save-baseline base; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The benchmarks of the merge base failed."
          fi
      # `--baseline-lenient` lets a benchmark the merge base lacks run
      # without a comparison, and `--no-fail-fast` keeps one failing
      # executable from hiding the others; whatever was captured is printed
      # even after a failure.
      - name: Benchmark the head against it
        if: steps.base.outputs.saved == 'true'
        run: |
          set -o pipefail
          status=0
          mise exec -- cargo bench --no-fail-fast -p eval -p bms-parser --bench evaluate --bench load -- --baseline-lenient base 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          {
            echo '### Benchmarks: head against merge base'
            echo 'Shared runners fluctuate; read a change as real only when it is large and repeats.'
            echo '```'
            grep -v '^Benchmarking ' "$RUNNER_TEMP/bench.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::The benchmarks of the head failed (exit $status); the results above are partial."
          fi

  compare-render:
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.3
          install: true
          install_args: rust
          cache: true
      - name: Benchmark the merge base
        id: base
        run: |
          base=$(git merge-base origin/main HEAD)
          echo "merge base $base, head $(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [ ! -f "$RUNNER_TEMP/base/crates/render/benches/skin.rs" ]; then
            echo "::notice::The merge base has no render benchmark; there is nothing to compare."
            exit 0
          fi
          if mise exec -- cargo bench --manifest-path "$RUNNER_TEMP/base/Cargo.toml" -p render --bench skin -- --save-baseline base; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The render benchmark of the merge base failed."
          fi
      - name: Benchmark the head against it
        if: steps.base.outputs.saved == 'true'
        run: |
          set -o pipefail
          status=0
          mise exec -- cargo bench --no-fail-fast -p render --bench skin -- --baseline-lenient base 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          {
            echo '### Render benchmark: head against merge base'
            echo 'Shared runners fluctuate; read a change as real only when it is large and repeats.'
            echo '```'
            grep -v '^Benchmarking ' "$RUNNER_TEMP/bench.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::The render benchmark of the head failed (exit $status); the results above are partial."
          fi
