name: Audit

# The advisory checks of CI on a schedule, so advisories published while the
# repository is idle are reported (docs/setup.md "Dependency Checks").

on:
  schedule:
    - cron: "41 20 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .cargo/audit.toml
      - .github/workflows/audit.yml
      - deny.toml
      - scripts/dep-check.sh

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Only the tools in install_args are needed; keep `mise exec` from
      # installing the rest on demand.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: rust cargo-deny aqua:rustsec/rustsec/cargo-audit
      # An unreadable registry index only warns and skips the yanked check;
      # dep-check.sh fails on it after three tries (docs/setup.md
      # "Dependency Checks").
      - name: cargo-deny
        run: |
          scripts/dep-check.sh deny check advisories --deny index-failure
          scripts/dep-check.sh deny --manifest-path fuzz/Cargo.toml --config deny.toml check advisories --deny index-failure
      # cargo-audit only logs index failures (on stderr, which dep-check.sh
      # scans).
      - name: cargo-audit
        run: |
          scripts/dep-check.sh audit --file Cargo.lock --deny warnings
          scripts/dep-check.sh audit --file fuzz/Cargo.lock --deny warnings
