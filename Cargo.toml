[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Its own workspace and lockfile, built with the nightly of the Nix `fuzz`
# shell (docs/setup.md "Fuzzing").
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
repository = "https://github.com/shuymn/tapestry"
publish = false

[workspace.dependencies]
bms-model = { path = "crates/bms-model" }
rules = { path = "crates/rules" }
eval = { path = "crates/eval" }
bms-parser = { path = "crates/bms-parser" }
replay = { path = "crates/replay" }
input = { path = "crates/input" }
game = { path = "crates/game" }
audio = { path = "crates/audio" }
render = { path = "crates/render" }

# bms-parser
chardetng = "1.0.0"
md-5 = { version = "0.11.0", default-features = false }
num-rational = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.19", default-features = false }

# bms-parser, replay and audio
sha2 = { version = "0.11.1", default-features = false }

# replay
zstd = { version = "0.14.3", default-features = false }

# input, game and audio
rtrb = "0.4.0"

# audio
rubato = { version = "5.0.1", default-features = false, features = ["fft_resampler"] }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "flac", "mp3"] }

# input (Windows only)
windows = "0.62.2"

# game
triple_buffer = "9.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

# game and xtask
tempfile = "3.27.0"

# player (Windows only)
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

# render (Windows only)
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
wgpu-hal = { version = "30.0.1", features = ["dx12"] }

# bms-parser and xtask
encoding_rs = "0.8.42"

# xtask (dev tooling, never shipped)
cargo_metadata = "0.23.1"
unicode-normalization = "0.1.26"
# The lint site check parses Rust source.
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing"] }

# Used by the `cargo xtask` alias (.cargo/config.toml).
[profile.xtask]
inherits = "dev"

# Lint configuration and the fixtures that prove each lint fires:
# `cargo xtask check-lints` (xtask/src/lints.rs).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `tapestry_lint_fixtures` is set only by `cargo xtask check-lints`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tapestry_lint_fixtures)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
