assert_lefthook_installed: true
glob_matcher: doublestar
no_tty: true
output: [summary, failure, execution_out]

pre-commit:
  parallel: true
  commands:
    # No glob: file names are checked too.
    banned-words:
      run: mise exec -- cargo xtask banned-words --staged
    rustfmt:
      glob: "**/*.rs"
      run: mise exec -- cargo fmt --all --check && mise exec -- cargo fmt --manifest-path fuzz/Cargo.toml --check
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint
    # An allocation guard added, renamed or left out of CI's release step.
    alloc-tests:
      glob: "{.github/workflows/ci.yml,**/tests/**/*.rs,**/Cargo.toml}"
      run: mise exec -- cargo xtask check-alloc-tests
    # A contract clause, a threat ID or a cited test changed.
    contract:
      glob: "{docs/design.md,crates/**/*.rs}"
      run: mise exec -- cargo xtask check-contract
    shellcheck:
      glob: "**/*.sh"
      run: mise exec -- shellcheck {staged_files}

# An automatic merge commit runs pre-merge-commit, not pre-commit. Rebases can
# replay commits without either hook; CI is the final gate.
pre-merge-commit:
  commands:
    banned-words:
      run: mise exec -- cargo xtask banned-words --staged
