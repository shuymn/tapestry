# cargo-deny configuration. Run with `mise exec -- cargo deny check`.

[graph]
# The platforms this workspace builds for: Windows (player) and Linux (CI).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# Check optional dependencies too, so the bans below also see crates that only
# a non-default feature pulls in.
all-features = true

[advisories]
# Vulnerabilities are errors (cargo-deny has no setting to lower them). The
# scopes below cover every crate in the graph, not only the workspace's direct
# dependencies (the pinned default for `unsound` is "workspace"), and a yanked
# version is an error (the default is a warning).
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Reviewed exceptions from the menu text stack (glyphon 0.12, cosmic-text
# 0.19, render), each with why it does not apply and when it goes.
ignore = [
    # `lru` 0.16: `LruCache::pop` is not panic-safe when a key's `Drop`
    # panics. lru's only user is glyphon's glyph cache (text_atlas.rs), keyed
    # by `GlyphonCacheKey`, a `Copy` enum of `Copy` keys with no `Drop`. Its
    # calls are `unbounded_with_hasher`, `peek_lru`, `pop_lru` and iteration
    # (text_atlas.rs) and `get` and `get_or_insert` (text_render.rs), never
    # `pop`. Remove it when a glyphon release accepts lru >= 0.18.2.
    { id = "RUSTSEC-2026-0253", reason = "glyphon never calls pop and its Copy keys have no Drop; remove when a glyphon release accepts lru >= 0.18.2" },
    # `ttf-parser` is unmaintained, with no advisory against its code. fontdb
    # 0.23 under cosmic-text 0.19 parses font tables with it, and only the
    # runtime font file chosen in the Windows fonts folder reaches it. Remove
    # it when a cosmic-text release (through glyphon) drops ttf-parser 0.25.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only, parses the Windows font file; remove when a cosmic-text release under glyphon drops ttf-parser 0.25" },
]

[licenses]
# Check dev-dependencies too, so a third-party GPL crate cannot enter a
# permissive crate as a test dependency (design.md "Licenses").
include-dev = true
# Only what the dependency graph needs. Add a license together with the
# crate that brings it in.
allow = [
    "MIT",        # most crates (MIT OR Apache-2.0), cargo_metadata
    "Apache-2.0", # most crates (MIT OR Apache-2.0)
    "Unicode-3.0", # unicode-ident, unicode-normalization
    "BSD-3-Clause", # encoding_rs (together with MIT OR Apache-2.0), zstd (replay)
    "MPL-2.0",    # triple_buffer, symphonia (audio decoding); used unmodified
    "Zlib",       # foldhash, under hashbrown in the wgpu graph, and slotmap under fontdb (render)
    "ISC",        # libloading, which wgpu-hal uses to load the DX12 runtime (render)
    "NCSA",       # libfuzzer-sys (LLVM libFuzzer), fuzz/ only
]

[licenses.private]
# Skip the workspace's own crates (all `publish = false`): some are GPL, and
# `cargo xtask check-arch` (R4) checks their licenses. GPL stays out of
# `allow`, so a third-party GPL crate is still rejected (design.md "Licenses").
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # The Windows API crate only inside the Windows-only crates (AGENTS.md).
    # `windows-sys` is not banned: portable crates such as tempfile use it
    # under cfg(windows).
    # Third-party direct parents, reviewed for the pinned wgpu graph (render):
    # - wgpu-hal: its DX12 backend (device, swap chain, waitable object).
    # - gpu-allocator: the D3D12 memory allocator of wgpu-hal's DX12 backend.
    { crate = "windows", wrappers = [
        "input",
        "audio",
        "render",
        "player",
        "wgpu-hal",
        "gpu-allocator",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
