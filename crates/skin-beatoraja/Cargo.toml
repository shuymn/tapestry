[package]
name = "skin-beatoraja"
version = "0.0.0"
description = "Imports skin definitions in the source format's lenient JSON and its Lua skins, run in a bounded sandbox: a bounded reader, include and branch resolution, the header with its screen kind, and the mapping of 7-key play skins' images, numbers, text and the play objects onto the skin model with a conversion report."
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[features]
# The Lua conversion report (src/bin/lua_report.rs), for the developer's
# PC only (docs/stage3.md §3), and the sandbox's VM hooks for the player's
# import tests (src/lua/vm_hooks.rs).
dev-tools = ["skin-model/dev-tools", "dep:eval"]

[dependencies]
bms-model.workspace = true
# The replay harness's frames (src/bin/lua_replay), dev-tools only.
eval = { workspace = true, optional = true }
image.workspace = true
mlua.workspace = true
rules.workspace = true
skin-model.workspace = true

[dev-dependencies]
# The memory fixtures load charts as a session does.
bms-parser.workspace = true
criterion.workspace = true
eval.workspace = true
# The turntable's clock drives the offset-1 frames as the player's does.
game.workspace = true
png.workspace = true
proptest.workspace = true
rules.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "lua_report"
required-features = ["dev-tools"]

[[bin]]
name = "lua_replay"
required-features = ["dev-tools"]

[[bench]]
name = "import"
harness = false

[[bench]]
name = "lua"
harness = false
required-features = ["dev-tools"]
