[package]
name = "render"
version = "0.0.0"
description = "The play screen and menu text: wgpu on DX12, the sprite batch and its staging, the atlas texture array with the bitmap font, the canvas projection and clips, the skin boundary with the simple skin, and Japanese text for menus."
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

# Excluded from `cargo xtask portable`; checked by `cargo xtask check-arch` (R2).
[package.metadata.tapestry]
windows-only = true

[dependencies]
bms-model.workspace = true
bytemuck.workspace = true
eval.workspace = true
game.workspace = true
glyphon.workspace = true
pollster.workspace = true
rules.workspace = true
skin-model.workspace = true
thiserror.workspace = true
wgpu.workspace = true
wgpu-hal.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Charts loaded from BMS text in the simple skin's tests.
criterion.workspace = true
bms-parser.workspace = true
# The pinned font's hash and the expected image of the menu text test.
png.workspace = true
sha2.workspace = true
tempfile.workspace = true
# A plain Win32 window for the swap chain test.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[[bench]]
name = "skin"
harness = false
