# Written by `cargo xtask media fixtures --record` in the flake's `ffmpeg`
# shell (docs/setup.md "Media fixtures"); `cargo xtask media fixtures`
# remakes the clips and checks them against these hashes. Self-made from
# FFmpeg's synthesized test frames.
ffmpeg = "ffmpeg version 8.1.2 Copyright (c) 2000-2026 the FFmpeg developers"
mkvmerge = "mkvmerge v102.0 ('Little Houses') 64-bit"

[commands]
"zlib/plain.mov" = "ffmpeg -f lavfi -i testsrc2=size=320x240:rate=30:duration=4 -c:v mpeg4 -g 15 -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 zlib/plain.mov"
"zlib/plain.mkv" = "ffmpeg -f lavfi -i testsrc2=size=320x240:rate=30:duration=4 -c:v mpeg4 -g 15 -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 zlib/plain.mkv"
"zlib/mpeg4-cmov.mov" = "zlib/mpeg4-cmov.mov: the cmov rewrite of zlib/plain.mov (cargo xtask media fixtures, zlib level 9)"
"zlib/mpeg4-zlib.mkv" = "mkvmerge -o zlib/mpeg4-zlib.mkv --deterministic 1 --compression 0:zlib zlib/plain.mkv"
"h264/h264-2560x1080.mp4" = "ffmpeg -f lavfi -i testsrc2=size=2560x1080:rate=30:duration=2 -c:v libx264 -preset medium -crf 34 -bf 3 -g 30 -pix_fmt yuv420p -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 h264/h264-2560x1080.mp4"
"h264/h264-1920x1080.mp4" = "ffmpeg -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=2 -c:v libx264 -preset medium -crf 34 -bf 3 -g 30 -pix_fmt yuv420p -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 h264/h264-1920x1080.mp4"
"colour/bt709-640x480.mkv" = "ffmpeg -f lavfi -i color=c=black:s=640x480:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190,setparams=range=tv:colorspace=bt709:color_primaries=bt709:color_trc=bt709 -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/bt709-640x480.mkv"
"colour/bt601-1920x1080.mkv" = "ffmpeg -f lavfi -i color=c=black:s=1920x1080:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190,setparams=range=tv:colorspace=smpte170m:color_primaries=smpte170m:color_trc=smpte170m -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace smpte170m -color_primaries smpte170m -color_trc smpte170m -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/bt601-1920x1080.mkv"
"colour/untagged-1280x720.mkv" = "ffmpeg -f lavfi -i color=c=black:s=1280x720:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190 -c:v libx264 -qp 0 -pix_fmt yuv420p -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/untagged-1280x720.mkv"
"colour/untagged-640x480.mkv" = "ffmpeg -f lavfi -i color=c=black:s=640x480:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190 -c:v libx264 -qp 0 -pix_fmt yuv420p -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/untagged-640x480.mkv"
"colour/full-320x240.mkv" = "ffmpeg -f lavfi -i color=c=black:s=320x240:r=10:d=0.2,format=yuv420p,lutyuv=y=255:u=128:v=128,setparams=range=pc:colorspace=smpte170m -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range pc -colorspace smpte170m -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/full-320x240.mkv"
"colour/mjpeg-320x240.avi" = "ffmpeg -f lavfi -i color=c=black:s=320x240:r=10:d=0.2,format=yuvj420p,lutyuv=y=100:u=90:v=190 -c:v mjpeg -q:v 2 -pix_fmt yuvj420p -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/mjpeg-320x240.avi"
"colour/range-change-128x96.mkv" = "ffmpeg -f lavfi -i color=c=black:s=128x96:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190,setparams=range=tv:colorspace=smpte170m -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace smpte170m -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 -f h264 colour/range-change-128x96.mkv.0.h264; ffmpeg -f lavfi -i color=c=black:s=128x96:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190,setparams=range=pc:colorspace=smpte170m -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range pc -colorspace smpte170m -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 -f h264 colour/range-change-128x96.mkv.1.h264; cat colour/range-change-128x96.mkv.0.h264 colour/range-change-128x96.mkv.1.h264 > colour/range-change-128x96.mkv.h264; ffmpeg -f h264 -framerate 10 -i colour/range-change-128x96.mkv.h264 -c copy -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/range-change-128x96.mkv"
"colour/matrix-change-128x96.mkv" = "ffmpeg -f lavfi -i color=c=black:s=128x96:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190,setparams=range=tv:colorspace=bt709 -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace bt709 -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 -f h264 colour/matrix-change-128x96.mkv.0.h264; ffmpeg -f lavfi -i color=c=black:s=128x96:r=10:d=0.2,format=yuv420p,lutyuv=y=100:u=90:v=190,setparams=range=tv:colorspace=smpte170m -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace smpte170m -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 -f h264 colour/matrix-change-128x96.mkv.1.h264; cat colour/matrix-change-128x96.mkv.0.h264 colour/matrix-change-128x96.mkv.1.h264 > colour/matrix-change-128x96.mkv.h264; ffmpeg -f h264 -framerate 10 -i colour/matrix-change-128x96.mkv.h264 -c copy -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/matrix-change-128x96.mkv"
"colour/gamut-change-128x96.mkv" = "ffmpeg -f lavfi -i color=c=black:s=128x96:r=10:d=0.2,format=yuv420p,lutyuv=y=50:u=64:v=176,setparams=range=tv:colorspace=bt709 -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace bt709 -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 -f h264 colour/gamut-change-128x96.mkv.0.h264; ffmpeg -f lavfi -i color=c=black:s=128x96:r=10:d=0.2,format=yuv420p,lutyuv=y=50:u=64:v=176,setparams=range=tv:colorspace=smpte170m -c:v libx264 -qp 0 -pix_fmt yuv420p -color_range tv -colorspace smpte170m -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 -f h264 colour/gamut-change-128x96.mkv.1.h264; cat colour/gamut-change-128x96.mkv.0.h264 colour/gamut-change-128x96.mkv.1.h264 > colour/gamut-change-128x96.mkv.h264; ffmpeg -f h264 -framerate 10 -i colour/gamut-change-128x96.mkv.h264 -c copy -fflags +bitexact -flags:v +bitexact -map_metadata -1 -threads 1 colour/gamut-change-128x96.mkv"

