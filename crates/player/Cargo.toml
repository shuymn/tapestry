[package]
name = "player"
version = "0.0.0"
description = "The Windows game executable and its media worker."
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tapestry"
path = "src/main.rs"

# The media worker (design.md "Threat Model" T02): the only binary that links
# FFmpeg, run by the game in a sandbox of its own.
[[bin]]
name = "tapestry-media"
path = "src/bin/tapestry-media/main.rs"

# Excluded from `cargo xtask portable`; checked by `cargo xtask check-arch` (R2).
[package.metadata.tapestry]
windows-only = true

[features]
default = []
# Development features. Never enabled in production builds (R3).
dev-tools = [
    "game/dev-tools",
    "input/dev-tools",
    "render/dev-tools",
    "skin-beatoraja/dev-tools",
    "dep:serde",
    "dep:serde_json",
    "dep:test-device",
    "dep:toml",
    # `tapestry test-device` (docs/test-device.md "Host Commands").
    "windows/Win32_Devices_Communication",
    "windows/Win32_Devices_DeviceAndDriverInstallation",
    "windows/Win32_Devices_HumanInterfaceDevice",
    "windows/Win32_Devices_Properties",
    "windows/Win32_Devices_Usb",
    "windows/Win32_Security",
    "windows/Win32_System_IO",
    "windows/Win32_System_Performance",
    "windows/Win32_System_Registry",
    "windows/Win32_UI_Input",
]

[dependencies]
anyhow.workspace = true
audio.workspace = true
bms-model.workspace = true
bms-parser.workspace = true
eval.workspace = true
ffmpeg-sys-next.workspace = true
game.workspace = true
input.workspace = true
lexopt.workspace = true
library.workspace = true
log.workspace = true
render.workspace = true
replay.workspace = true
rtrb.workspace = true
rules.workspace = true
skin-beatoraja.workspace = true
skin-model.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
test-device = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
winit.workspace = true

# The build script checks that `target/ffmpeg/` holds the release ffmpeg.toml
# pins and copies its DLLs beside the binaries.
[build-dependencies]
toml.workspace = true

[dev-dependencies]
image.workspace = true
png.workspace = true
rusqlite.workspace = true
# The render tests' shared helpers wait on the device.
wgpu.workspace = true
tempfile.workspace = true
toml.workspace = true
# The window test's desktop of its own and its `SendInput` counter.
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_StationsAndDesktops",
] }

[lints]
workspace = true

# Tests include fixtures from other crates by path, which cargo-machete does not
# follow: the library's (the bests tests open its database with rusqlite) and
# render's declarative and imported skin support (it writes PNG files).
[package.metadata.cargo-machete]
ignored = ["png", "rusqlite", "wgpu"]
