[package]
name = "player"
version = "0.0.0"
description = "The Windows game executable."
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tapestry"
path = "src/main.rs"

# Excluded from `cargo xtask portable`; checked by `cargo xtask check-arch` (R2).
[package.metadata.tapestry]
windows-only = true

[features]
default = []
# Development features. Never enabled in production builds (R3).
dev-tools = []

[dependencies]
anyhow.workspace = true
audio.workspace = true
bms-model.workspace = true
eval.workspace = true
game.workspace = true
input.workspace = true
lexopt.workspace = true
render.workspace = true
replay.workspace = true
rtrb.workspace = true
rules.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winit.workspace = true

[dev-dependencies]
bms-parser.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
