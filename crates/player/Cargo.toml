[package]
name = "player"
version = "0.0.0"
description = "The Windows game executable."
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tapestry"
path = "src/main.rs"

# Excluded from `cargo xtask portable`; checked by `cargo xtask check-arch` (R2).
[package.metadata.tapestry]
windows-only = true

[features]
default = []
# Development features. Never enabled in production builds (R3).
dev-tools = ["game/dev-tools", "dep:serde", "dep:toml"]

[dependencies]
anyhow.workspace = true
audio.workspace = true
bms-model.workspace = true
eval.workspace = true
game.workspace = true
input.workspace = true
lexopt.workspace = true
library.workspace = true
log.workspace = true
render.workspace = true
replay.workspace = true
rtrb.workspace = true
rules.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }
winit.workspace = true

[dev-dependencies]
bms-parser.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true

# The bests tests include the library's shared test fixture by path, which
# opens the database with rusqlite; cargo-machete does not follow #[path].
[package.metadata.cargo-machete]
ignored = ["rusqlite"]
