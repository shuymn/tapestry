[package]
name = "bms-parser"
version = "0.0.0"
description = "BMS chart loader: text to a resolved chart model."
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
bms-model.workspace = true
chardetng.workspace = true
md-5.workspace = true
num-rational.workspace = true
num-traits.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The `md-5` package's library is named `md5`; `--with-metadata` reads that from
# cargo metadata, and this mapping gives plain `cargo machete` the same name.
[package.metadata.cargo-machete.renamed]
md-5 = "md5"
