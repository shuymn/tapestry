[package]
name = "eval"
version = "0.0.0"
description = "Pure evaluator: (chart, input log, preset) to judgment event stream."
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

# `cargo xtask check-arch` (R1) rejects any normal or build dependency
# outside `bms-model`, `rules`, and the reviewed allowlist in
# `xtask/src/arch.rs`. Dev-dependencies (tests and benchmarks) are outside R1.
[dependencies]
bms-model.workspace = true
rules.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "evaluate"
harness = false
